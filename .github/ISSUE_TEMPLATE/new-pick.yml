name: New pick
description: Suggest a repo for Awesome Agent Engineering
title: "Pick: "
labels: ["new pick"]
body:
  - type: input
    id: repo
    attributes:
      label: Repository link
      placeholder: https://github.com/owner/name
    validations:
      required: true
  - type: input
    id: job
    attributes:
      label: The one job it does
    validations:
      required: true
  - type: dropdown
    id: section
    attributes:
      label: Section
      options:
        - Agent frameworks and SDKs
        - Autonomous and multi-agent
        - Self-improving and reasoning
        - Agent UI, outputs and prompts
        - Workflow automation
        - Voice and realtime agents
        - Sandboxes, guardrails and evals
        - Learn agent engineering
        - I am not sure
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it belongs here
  - type: checkboxes
    id: rules
    attributes:
      label: Rules
      options:
        - label: Public repo with a clear license
          required: true
        - label: Works today, maintained or a finished classic
          required: true
